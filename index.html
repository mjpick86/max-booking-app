<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Max's Booking Engine</title>
    <link href=
'https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/ui-lightness/jquery-ui.css'
          rel='stylesheet'>

    <script src=
"https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js">
    </script>

    <script src=
"https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js">
    </script>    </head>

    <body>
        <h1>Max's Booking Engine</h1>

        <form>
        Full Name: <input type="text" id="nameInput" placeholder="Enter your name" required/>
        <p>Check-in Date: <input type="text" id="checkInInput" placeholder="Enter a date" required/></p>
        <p>Check-out Date: <input type="text" id="checkOutInput" placeholder="Enter a date" required/></p>
        <p>Comments (e.g. reason for visit): <input type="text" id="commentsInput" placeholder="Enter comments" /></p>
        <input type="submit" id="submitButton" value="Submit Booking" />
        </form>
        <p id="helperText">Hello</p>

        <script src="app.js"></script>
    </body>
</html>
